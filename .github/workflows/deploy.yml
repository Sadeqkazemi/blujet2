name: Deploy UAT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uat-deployment
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy exact commit
    needs: ci
    environment: uat
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded into the remote session by name (envs: below)
          # rather than interpolated as literal text into the script -
          # the value never appears in the rendered workflow/script string.
          UAT_PANEL_SHARED_PASSWORD: ${{ secrets.UAT_PANEL_SHARED_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: UAT_PANEL_SHARED_PASSWORD,DEPLOY_SHA
          script: |
            set -e
            cd /opt/app
            case "${DEPLOY_SHA:-}" in
              ''|*[!0-9a-f]*)
                echo "Refusing deploy: invalid commit SHA." >&2
                exit 1
                ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Refusing deploy: commit SHA must have 40 characters." >&2
              exit 1
            fi
            git fetch --no-tags origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            # This host is the owner-approved UAT sandbox. Keep the backend
            # mock OTP and the matching frontend notice in sync for every
            # compose build/recreation without writing secrets to the repo.
            export AUTH_SANDBOX_ENABLED=true
            export VITE_SANDBOX_AUTH=true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --wait
            # One-time, owner-approved UAT access while Kavenegar is repaired.
            # Credentials never enter Actions logs: stdout is redirected on the
            # server into a root-only file. The sentinel prevents password
            # rotation/recreation on later deploys; DB-level expiry is 7 days.
            credentials=/root/blujet-temporary-panel-credentials.json
            sentinel=/root/.blujet-temporary-panel-bootstrap-complete
            if [ ! -f "$sentinel" ]; then
              umask 077
              docker compose -f docker-compose.prod.yml exec -T \
                -e TEMP_PANEL_BOOTSTRAP_CONFIRM=CREATE_7_DAY_PANEL_TEST_ACCOUNTS \
                backend node dist/database/bootstrap-temporary-panel-accounts.js --execute \
                > "$credentials"
              chmod 600 "$credentials"
              touch "$sentinel"
              chmod 600 "$sentinel"
            fi
            # Owner-approved one-time migration to easier-to-type temporary
            # passwords. The script preserves the existing seven-day expiry,
            # rotates all accounts atomically, and revokes active sessions.
            rotation_sentinel=/root/.blujet-temporary-panel-password-format-v1-complete
            if [ ! -f "$rotation_sentinel" ]; then
              umask 077
              temporary_credentials="$(mktemp /root/blujet-temporary-panel-credentials.json.XXXXXX)"
              cleanup_temporary_credentials() {
                if [ -n "${temporary_credentials:-}" ]; then
                  rm -f "$temporary_credentials"
                fi
              }
              trap cleanup_temporary_credentials EXIT
              docker compose -f docker-compose.prod.yml exec -T \
                -e TEMP_PANEL_ROTATE_CONFIRM=ROTATE_TEMPORARY_PANEL_PASSWORDS_ALPHANUMERIC_V1 \
                backend node dist/database/rotate-temporary-panel-passwords.js --execute \
                > "$temporary_credentials"
              chmod 600 "$temporary_credentials"
              mv -f "$temporary_credentials" "$credentials"
              temporary_credentials=
              touch "$rotation_sentinel"
              chmod 600 "$rotation_sentinel"
              trap - EXIT
            fi
            # One-time move to a single shared UAT password (owner-approved):
            # bootstraps any temporary accounts added since the original
            # seven (uat.employee, uat.agency, uat.customer - bootstrap
            # skips ones that already exist) and rotates every temporary
            # account's password to UAT_PANEL_SHARED_PASSWORD.
            # $UAT_PANEL_SHARED_PASSWORD is forwarded into this session by
            # appleboy/ssh-action's `envs:` (see the step's `env:` above) -
            # never interpolated into this script as literal text by GitHub's
            # expression templating, and the two scripts below never print it, so
            # it never reaches these stdout redirects or the Actions log.
            shared_password_sentinel=/root/.blujet-uat-shared-password-v1-complete
            if [ ! -f "$shared_password_sentinel" ]; then
              if [ -z "${UAT_PANEL_SHARED_PASSWORD:-}" ]; then
                echo "Refusing: UAT_PANEL_SHARED_PASSWORD secret is empty or unset." >&2
                exit 1
              fi
              umask 077
              docker compose -f docker-compose.prod.yml exec -T \
                -e TEMP_PANEL_BOOTSTRAP_CONFIRM=CREATE_7_DAY_PANEL_TEST_ACCOUNTS \
                -e UAT_PANEL_SHARED_PASSWORD="$UAT_PANEL_SHARED_PASSWORD" \
                backend node dist/database/bootstrap-temporary-panel-accounts.js --execute \
                > /root/blujet-uat-shared-password-bootstrap-v1.json
              chmod 600 /root/blujet-uat-shared-password-bootstrap-v1.json
              docker compose -f docker-compose.prod.yml exec -T \
                -e TEMP_PANEL_ROTATE_CONFIRM=ROTATE_TEMPORARY_PANEL_PASSWORDS_SHARED_V1 \
                -e UAT_PANEL_SHARED_PASSWORD="$UAT_PANEL_SHARED_PASSWORD" \
                backend node dist/database/rotate-temporary-panel-passwords.js --execute \
                > /root/blujet-uat-shared-password-rotation-v1.json
              chmod 600 /root/blujet-uat-shared-password-rotation-v1.json
              touch "$shared_password_sentinel"
              chmod 600 "$shared_password_sentinel"
            fi
            # Provision the operations-manager UAT account introduced after
            # the shared-password v1 sentinel had already been consumed on
            # the live UAT host. Bootstrap is idempotent and therefore skips
            # every existing temporary account while creating only the new
            # uat.operations identity with the same shared secret.
            operations_account_sentinel=/root/.blujet-uat-operations-account-v1-complete
            if [ ! -f "$operations_account_sentinel" ]; then
              if [ -z "${UAT_PANEL_SHARED_PASSWORD:-}" ]; then
                echo "Refusing: UAT_PANEL_SHARED_PASSWORD secret is empty or unset." >&2
                exit 1
              fi
              umask 077
              docker compose -f docker-compose.prod.yml exec -T \
                -e TEMP_PANEL_BOOTSTRAP_CONFIRM=CREATE_7_DAY_PANEL_TEST_ACCOUNTS \
                -e UAT_PANEL_SHARED_PASSWORD="$UAT_PANEL_SHARED_PASSWORD" \
                backend node dist/database/bootstrap-temporary-panel-accounts.js --execute \
                > /root/blujet-uat-operations-account-v1.json
              chmod 600 /root/blujet-uat-operations-account-v1.json
              touch "$operations_account_sentinel"
              chmod 600 "$operations_account_sentinel"
            fi
            # One-time UAT cleanup. A root-only PostgreSQL backup is completed
            # before the safeguarded purge; required access accounts and
            # reference/configuration tables are retained by the purge policy.
              purge_sentinel=/root/.blujet-uat-demo-data-purge-v1-complete
            if [ ! -f "$purge_sentinel" ]; then
              umask 077
                purge_backup="/root/blujet-uat-before-demo-purge-$(date -u +%Y%m%dT%H%M%SZ).dump"
                purge_audit=/root/blujet-uat-demo-data-purge-v1.json
              docker compose -f docker-compose.prod.yml exec -T db \
                pg_dump -U blujet -d blujet --format=custom > "$purge_backup"
              chmod 600 "$purge_backup"
              docker compose -f docker-compose.prod.yml exec -T backend \
                node dist/database/uat-demo-data-purge.js > "$purge_audit"
              docker compose -f docker-compose.prod.yml exec -T \
                -e UAT_DEMO_PURGE_CONFIRM=PURGE_BLUJET_UAT_DEMO_DATA \
                -e UAT_DEMO_PURGE_BACKUP_REF="$purge_backup" \
                backend node dist/database/uat-demo-data-purge.js --execute-purge \
                >> "$purge_audit"
              chmod 600 "$purge_audit"
              docker compose -f docker-compose.prod.yml exec -T redis \
                redis-cli FLUSHDB > /dev/null
              touch "$purge_sentinel"
              chmod 600 "$purge_sentinel"
              fi
              catalog_sentinel=/root/.blujet-uat-flight-catalog-cleanup-v1-complete
              if [ ! -f "$catalog_sentinel" ]; then
                umask 077
                catalog_backup="/root/blujet-uat-before-flight-catalog-cleanup-$(date -u +%Y%m%dT%H%M%SZ).dump"
                catalog_audit=/root/blujet-uat-flight-catalog-cleanup-v1.json
                docker compose -f docker-compose.prod.yml exec -T db \
                  pg_dump -U blujet -d blujet --format=custom > "$catalog_backup"
                chmod 600 "$catalog_backup"
                docker compose -f docker-compose.prod.yml exec -T \
                  -e UAT_FLIGHT_CATALOG_CLEANUP_CONFIRM=CLEAR_BLUJET_UAT_FLIGHT_CATALOG \
                  -e UAT_FLIGHT_CATALOG_DELETE_ROUTES_CONFIRM=DELETE_BLUJET_UAT_ROUTES \
                  -e UAT_FLIGHT_CATALOG_CLEANUP_BACKUP_REF="$catalog_backup" \
                  backend node dist/database/uat-flight-catalog-cleanup.js --execute-cleanup \
                  > "$catalog_audit"
                chmod 600 "$catalog_audit"
                docker compose -f docker-compose.prod.yml exec -T redis \
                  redis-cli FLUSHDB > /dev/null
                touch "$catalog_sentinel"
                chmod 600 "$catalog_sentinel"
              fi
              docker image prune -f
